openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: WALLPAPER.MINIMAL API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: wallpapers
    description: Wallpaper operations
  - name: checkout
    description: Stripe checkout operations
  - name: orders
    description: Order management
  - name: bundles
    description: Bundle management
  - name: promos
    description: Promo codes
  - name: settings
    description: Admin settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /wallpapers:
    get:
      operationId: listWallpapers
      tags: [wallpapers]
      summary: List all wallpapers
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of wallpapers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallpaper"
    post:
      operationId: createWallpaper
      tags: [wallpapers]
      summary: Create a new wallpaper (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallpaperInput"
      responses:
        "201":
          description: Created wallpaper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallpaper"

  /wallpapers/{id}:
    get:
      operationId: getWallpaper
      tags: [wallpapers]
      summary: Get a single wallpaper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallpaper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallpaper"
        "404":
          description: Not found
    patch:
      operationId: updateWallpaper
      tags: [wallpapers]
      summary: Update a wallpaper (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WallpaperUpdate"
      responses:
        "200":
          description: Updated wallpaper
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallpaper"
    delete:
      operationId: deleteWallpaper
      tags: [wallpapers]
      summary: Delete a wallpaper (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /wallpapers/featured:
    get:
      operationId: getFeaturedWallpapers
      tags: [wallpapers]
      summary: Get featured wallpapers for iPhone mockup cycling
      responses:
        "200":
          description: Featured wallpapers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallpaper"

  /wallpapers/categories:
    get:
      operationId: getCategories
      tags: [wallpapers]
      summary: Get all available categories with counts
      responses:
        "200":
          description: Categories with counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryCount"

  /checkout/session:
    post:
      operationId: createCheckoutSession
      tags: [checkout]
      summary: Create a Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [wallpapers]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List all orders
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/stats:
    get:
      operationId: getOrderStats
      tags: [orders]
      summary: Get revenue and order stats for dashboard
      responses:
        "200":
          description: Order stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStats"

  /orders/{id}:
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    delete:
      operationId: deleteOrder
      tags: [orders]
      summary: Delete an order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /bundles:
    get:
      operationId: listBundles
      tags: [bundles]
      summary: List all bundles
      responses:
        "200":
          description: List of bundles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bundle"
    post:
      operationId: createBundle
      tags: [bundles]
      summary: Create a bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleInput"
      responses:
        "201":
          description: Created bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"

  /bundles/{id}:
    patch:
      operationId: updateBundle
      tags: [bundles]
      summary: Update a bundle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BundleUpdate"
      responses:
        "200":
          description: Updated bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bundle"
    delete:
      operationId: deleteBundle
      tags: [bundles]
      summary: Delete a bundle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /promos:
    get:
      operationId: listPromos
      tags: [promos]
      summary: List all promo codes
      responses:
        "200":
          description: List of promo codes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PromoCode"
    post:
      operationId: createPromo
      tags: [promos]
      summary: Create a promo code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeInput"
      responses:
        "201":
          description: Created promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"

  /promos/{id}:
    patch:
      operationId: updatePromo
      tags: [promos]
      summary: Update a promo code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoCodeUpdate"
      responses:
        "200":
          description: Updated promo code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoCode"
    delete:
      operationId: deletePromo
      tags: [promos]
      summary: Delete a promo code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /promos/validate:
    post:
      operationId: validatePromo
      tags: [promos]
      summary: Validate a promo code and get discount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoValidateInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromoValidateResult"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get all admin settings
      responses:
        "200":
          description: Settings map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"
    post:
      operationId: saveSettings
      tags: [settings]
      summary: Save admin settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsMap"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Wallpaper:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        image_url:
          type: string
        featured:
          type: boolean
        created_at:
          type: string
      required: [id, name, category, price, image_url, featured, created_at]

    WallpaperInput:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        price:
          type: number
        image_url:
          type: string
        featured:
          type: boolean
      required: [name, category, price, image_url]

    WallpaperUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        price:
          type: number
        image_url:
          type: string
        featured:
          type: boolean

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required: [category, count]

    CheckoutInput:
      type: object
      properties:
        type:
          type: string
          enum: [single, pack, bundle]
        wallpaper_id:
          type: ["string", "null"]
        bundle_name:
          type: ["string", "null"]
        price:
          type: number
        name:
          type: string
        promo_code:
          type: ["string", "null"]
      required: [type, price, name]

    CheckoutSession:
      type: object
      properties:
        url:
          type: string
        original_price:
          type: number
        final_price:
          type: number
        discount_applied:
          type: number
      required: [url, original_price, final_price, discount_applied]

    NewsletterInput:
      type: object
      properties:
        email:
          type: string
      required: [email]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    Order:
      type: object
      properties:
        id:
          type: string
        stripe_session_id:
          type: string
        product_name:
          type: string
        product_type:
          type: string
        price:
          type: number
        customer_email:
          type: string
        status:
          type: string
        promo_code:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, product_name, product_type, price, customer_email, status, created_at]

    OrderInput:
      type: object
      properties:
        stripe_session_id:
          type: string
        product_name:
          type: string
        product_type:
          type: string
        price:
          type: number
        customer_email:
          type: string
        status:
          type: string
        promo_code:
          type: ["string", "null"]
      required: [product_name, product_type, price, customer_email]

    OrderUpdate:
      type: object
      properties:
        status:
          type: string
        customer_email:
          type: string

    OrderStats:
      type: object
      properties:
        total_revenue:
          type: number
        total_orders:
          type: integer
        orders_today:
          type: integer
        revenue_today:
          type: number
        revenue_by_type:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              revenue:
                type: number
              count:
                type: integer
            required: [type, revenue, count]
        recent_orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required: [total_revenue, total_orders, orders_today, revenue_today, revenue_by_type, recent_orders]

    Bundle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        wallpaper_count:
          type: integer
        price:
          type: number
        popular:
          type: boolean
        active:
          type: boolean
        created_at:
          type: string
      required: [id, name, description, wallpaper_count, price, popular, active, created_at]

    BundleInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        wallpaper_count:
          type: integer
        price:
          type: number
        popular:
          type: boolean
        active:
          type: boolean
      required: [name, description, wallpaper_count, price]

    BundleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        wallpaper_count:
          type: integer
        price:
          type: number
        popular:
          type: boolean
        active:
          type: boolean

    PromoCode:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
        max_uses:
          type: ["integer", "null"]
        uses_count:
          type: integer
        active:
          type: boolean
        expires_at:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, code, discount_type, discount_value, uses_count, active, created_at]

    PromoCodeInput:
      type: object
      properties:
        code:
          type: string
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
        max_uses:
          type: ["integer", "null"]
        active:
          type: boolean
        expires_at:
          type: ["string", "null"]
      required: [code, discount_type, discount_value]

    PromoCodeUpdate:
      type: object
      properties:
        code:
          type: string
        discount_type:
          type: string
          enum: [percent, fixed]
        discount_value:
          type: number
        max_uses:
          type: ["integer", "null"]
        active:
          type: boolean
        expires_at:
          type: ["string", "null"]

    PromoValidateInput:
      type: object
      properties:
        code:
          type: string
        price:
          type: number
      required: [code, price]

    PromoValidateResult:
      type: object
      properties:
        valid:
          type: boolean
        discount_type:
          type: ["string", "null"]
        discount_value:
          type: ["number", "null"]
        final_price:
          type: number
        message:
          type: string
      required: [valid, final_price, message]

    SettingsMap:
      type: object
      additionalProperties:
        type: string
